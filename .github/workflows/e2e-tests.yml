name: E2E (Playwright)

on:
  push:
    branches: ['main', 'rebuild']
    paths:
      - 'src/**'
      - 'content/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'next.config.js'
      - 'package.json'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'content/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'next.config.js'
      - 'package.json'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on:
      group: sindlish-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      # package-lock.json is gitignored in this repository, so `npm ci` has no
      # lockfile to consume on a fresh checkout.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The Playwright config builds and starts the production server itself.
      - name: Run Playwright against the production build
        run: npm test
        env:
          NEXT_PUBLIC_DEFAULT_SITE_URL: http://localhost:3000
          WP_GRAPHQL_URL: ${{ secrets.WP_GRAPHQL_URL }}
          NEXT_PUBLIC_GITHUB_PATH: ${{ secrets.NEXT_PUBLIC_GITHUB_PATH }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
